<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NousLab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@700&display=swap">
<style>
/* 版面：上方類型列 → 中段「角色｜敵人｜結果」三欄等高對齊 → 下方速查；提升比較為「敵人條 → 隊伍卡 → 方案｜結果」 */
:root {
  --bg: #f3f4f6;
  --surface: #ffffff;
  --sunk: #f0f1f4;
  --ink: #16181d;
  --muted: #666d7a;
  --line: #e2e5ea;
  --accent: #b2741c;
  --accent-ink: #ffffff;
  --accent-soft: #f6ebd8;
  --good: #1d7a50;
  --warn: #b4432f;
  --off: #a3a9b3;
  --info: #2f7fc1;
  /* 文字用系統介面字（Windows 微軟正黑體、Mac 蘋方）；數字用 JetBrains Mono */
  --sans: system-ui, -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei UI", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, "Microsoft JhengHei", monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1014; --surface: #16191f; --sunk: #1d2027; --ink: #eceef2; --muted: #9aa1ad; --line: #272b33;
    --accent: #e4ab4c; --accent-ink: #1a140a; --accent-soft: #33281a; --good: #5cc290; --warn: #ef8068; --off: #5c6370; --info: #6cb4ef;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1014; --surface: #16191f; --sunk: #1d2027; --ink: #eceef2; --muted: #9aa1ad; --line: #272b33;
  --accent: #e4ab4c; --accent-ink: #1a140a; --accent-soft: #33281a; --good: #5cc290; --warn: #ef8068; --off: #5c6370; --info: #6cb4ef;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap {
  max-width: 1240px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* 頂部 */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-inner { display: flex; align-items: center; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: .02em; }
/* 專案名 NousLab：較大的字標，「Lab」用強調色，前面一個斜切方塊標記 */
.brand h1.logo { display: flex; align-items: center; gap: 10px; font: 700 30px/1 "Space Grotesk", var(--sans); letter-spacing: -.02em; }

.brand h1.logo .logo-lab { color: var(--accent); }

@media (max-width: 520px) { .brand h1.logo { font-size: 26px; } }
.brand span { font: 500 11px var(--mono); color: var(--muted); padding: 2px 6px; border: 1px solid var(--line); border-radius: 999px; }
/* 頁首三欄：字標｜分頁（置中）｜工具列；分頁是純文字連結，滑過才有底色 */
.top-inner { display: grid; grid-template-columns: 1fr auto 1fr; }
.tabs { display: flex; gap: 4px; }
.tabs button { border: 0; background: none; color: var(--muted); font: 500 14px var(--sans); padding: 7px 14px; border-radius: 8px; cursor: pointer; white-space: nowrap; transition: background-color .15s, color .15s; }
.tabs button:hover { background: var(--sunk); color: var(--ink); }
.tabs button[aria-selected="true"] { background: none; color: var(--ink); font-weight: 700; }
.menu-btn { display: none; justify-self: end; align-items: center; gap: 8px; height: 36px; padding: 0 10px 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--sunk); color: var(--ink); font: 500 14px var(--sans); cursor: pointer; }
.menu-btn svg { width: 18px; height: 18px; color: var(--muted); }
/* 頁首右側工具列：繁簡切換、深色模式、GitHub */
.top-tools { display: flex; align-items: center; gap: 6px; justify-self: end; }
.top-tools:empty { display: none; }
.tool-btn { height: 36px; padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--sunk); color: var(--muted); font: 500 13px var(--sans); text-decoration: none; cursor: pointer; }
.tool-btn:hover { color: var(--ink); }
.tool-btn svg { width: 18px; height: 18px; flex: none; }
.top-lang, .top-theme, .top-link { width: 36px; padding: 0; }
.top-link:not([href]) { cursor: default; }
/* 手機選單最下方的繁簡與深色（桌機不顯示） */
.menu-extra { display: none; }
/* 手機：頁首縮成一行，分頁收進漢堡選單，展開時在頁首下方直列 */
@media (max-width: 760px) {
  .top-inner { grid-template-columns: 1fr auto auto; gap: 8px; }
  .menu-btn { display: inline-flex; }
  .tabs { display: none; order: 9; grid-column: 1 / -1; flex-direction: column; gap: 2px; padding-top: 6px; border-top: 1px solid var(--line); }
  header.top.open .tabs { display: flex; }
  .tabs button { text-align: left; padding: 11px 12px; }
  .top-tools .top-lang, .top-tools .top-theme { display: none; }
  .menu-extra { order: 10; grid-column: 1 / -1; gap: 8px; padding: 8px 0 2px; border-top: 1px solid var(--line); }
  header.top.open .menu-extra { display: flex; }
}

main { padding-block: 20px 32px; display: grid; gap: 16px; }
/* 頁尾：創作者與版權聲明 */
footer.foot { border-top: 1px solid var(--line); padding-block: 16px calc(24px + env(safe-area-inset-bottom, 0px)); color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; }
footer.foot b { color: var(--ink); font-weight: 600; }
/* 簡體轉換完成前先不顯示（見頁首 script） */
html.lang-wait body { visibility: hidden; }

/* 面板 */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.panel-h { display: flex; align-items: center; gap: 8px; min-height: 28px; }
.panel-h h2 { font-size: 15px; font-weight: 600; margin: 0; }
.panel-h .sub { color: var(--muted); font-size: 12px; }
.panel-h .end { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.label-sm { font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--muted); }
.hr { height: 1px; background: var(--line); margin-block: 8px; }

/* 欄位 */
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.fields.wide { grid-template-columns: repeat(auto-fill, minmax(140px, 180px)); }
.f { display: grid; gap: 5px; min-width: 0; }
.f-label { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
.f-label label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.box { display: flex; align-items: center; height: 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--sunk); overflow: hidden; }
.box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--surface); }
.box input, .box select { flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; color: var(--ink); font: 500 13px var(--mono); padding: 0 10px; outline: none; }
.box select { font-family: var(--sans); cursor: pointer; }
/* 下拉選單的選項跟著主題色，深色模式不會跳出白底 */
select option { background: var(--surface); color: var(--ink); }
/* 支援可自訂下拉選單的瀏覽器（Chromium 135+）：展開的選單也改成圓角、主題色 */
@supports (appearance: base-select) {
  .box select { appearance: base-select; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .box select::picker-icon { color: var(--muted); font-size: 10px; }
  select::picker(select) { appearance: base-select; margin-top: 6px; padding: 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); box-shadow: 0 10px 28px rgb(0 0 0 / .22); }
  select option { padding: 7px 10px; border-radius: 6px; font: 500 13px var(--sans); }
  select option:hover, select option:focus-visible { background: var(--sunk); outline: none; }
  select option:checked { background: var(--accent-soft); color: var(--ink); }
  select option::checkmark { display: none; }
}
.box .u { padding-right: 10px; color: var(--muted); font: 12px var(--mono); }
.box input.txt { font-family: var(--sans); font-weight: 600; }
/* 暴擊率／暴擊傷害一格裝兩個數字，在窄卡片裡橫跨兩欄 */
.char .f-crit { grid-column: span 2; }
.box.duo input { padding-right: 2px; }
.box:has(input:disabled) { background: transparent; border-style: dashed; }
.box input:disabled { color: var(--muted); cursor: not-allowed; }
.box.duo .u { padding-right: 6px; }
.box .sep { color: var(--off); font: 500 14px var(--mono); padding: 0 2px; }
/* 算式條：每個乘區一格，乘號串起來，最後等於結果；滑過每格看算法 */
/* 算式：一行文字，滑過乘區名稱時出現淡底色並顯示算法 */
.eq { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 6px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 16px; line-height: 1.8; }
.term { position: relative; font-weight: 500; white-space: nowrap; cursor: help; padding: 0 4px; border-radius: 6px; }
.term:hover, .term:focus { background: var(--sunk); outline: none; }
.term.total { color: var(--accent); font-weight: 700; cursor: default; }
.term.total:hover { background: none; }
.op { color: var(--off); font: 400 15px var(--mono); }
.term::after { content: attr(data-tip); position: absolute; left: 0; top: calc(100% + 6px); z-index: 20; width: max-content; max-width: 280px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); box-shadow: 0 8px 24px rgb(0 0 0 / .18); font: 400 12px/1.5 var(--sans); white-space: normal; opacity: 0; pointer-events: none; }
.term:hover::after, .term:focus::after { opacity: 1; }
.term.total::after { left: auto; right: 0; }
/* 沒有說明文字的格子不畫提示框，避免出現空白小框 */
.term[data-tip=""]::after, .q[data-tip=""]::after { display: none; }
.eq-hint { flex-basis: 100%; font-size: 12px; color: var(--muted); }
.typebar .switch { margin-left: auto; }
.fx-body { display: grid; gap: 12px; padding-top: 14px; border-top: 1px solid var(--line); }
.fx-body .eq { border-top: 0; padding-top: 0; }
.type-note { font-size: 12px; color: var(--off); margin: -6px 0 0; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.na { font-size: 12px; color: var(--off); margin: 0; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; user-select: none; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .track { position: relative; width: 34px; height: 20px; border-radius: 999px; background: var(--line); transition: background .15s; }
.switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgb(0 0 0 / .25); transition: transform .15s; }
.switch input:checked + .track { background: var(--accent); }
.switch input:checked + .track::after { transform: translateX(14px); }
.switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
.switch.sm { height: 34px; font-size: 12px; color: var(--muted); }
.switch.sm .track { width: 28px; height: 16px; }
.switch.sm .track::after { width: 12px; height: 12px; }
.switch.sm input:checked + .track::after { transform: translateX(12px); }
.toggle { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--sunk); cursor: pointer; font-size: 13px; }
.toggle input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }

/* 說明小圓點 */
.q { position: relative; flex: none; width: 15px; height: 15px; border-radius: 50%; border: 1px solid var(--off); color: var(--muted); font: 600 10px/13px var(--sans); text-align: center; cursor: help; }
.q::after { content: attr(data-tip); position: absolute; left: 50%; top: calc(100% + 6px); transform: translateX(-50%); z-index: 20; width: max-content; max-width: 220px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); box-shadow: 0 8px 24px rgb(0 0 0 / .18); font: 400 12px/1.5 var(--sans); text-align: left; white-space: normal; opacity: 0; pointer-events: none; }
.q:hover::after, .q:focus::after { opacity: 1; }
.q:hover, .q:focus { border-color: var(--muted); color: var(--ink); background: var(--sunk); outline: none; }

/* 按鈕 */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: 500 13px var(--sans); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.x { flex: none; width: 28px; height: 28px; border: 0; border-radius: 6px; background: none; color: var(--off); font-size: 18px; line-height: 1; cursor: pointer; }
.x:hover { background: var(--sunk); color: var(--warn); }
.x:disabled { visibility: hidden; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* 數字欄位不顯示上下 ±1 按鈕 */
input[type=number] { -moz-appearance: textfield; appearance: textfield; }
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.q:focus-visible { outline: 2px solid var(--muted); outline-offset: 2px; }

/* 類型切換 */
.typebar { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; background: var(--sunk); border-radius: 10px; }
.seg button { border: 0; background: none; color: var(--muted); font: 500 15px var(--sans); padding: 7px 14px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .1); }
.skip { font-size: 13px; color: var(--muted); min-width: 0; }
.skip b { color: var(--ink); font-weight: 600; }

/* 傷害計算版面 */
.calc-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)) minmax(300px, 360px); gap: 16px; align-items: stretch; }
.calc-grid .span2 { grid-column: span 2; }
.sticky { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); }
@media (max-width: 1080px) {
  .calc-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .calc-grid .result { grid-column: 1 / -1; order: -1; }
  .sticky { position: static; }
}
@media (max-width: 640px) {
  .calc-grid { grid-template-columns: minmax(0, 1fr); }
  .calc-grid .span2 { grid-column: auto; }
}

/* 結果 */
.hero { display: grid; gap: 2px; }
.hero .k { font-size: 12px; color: var(--muted); }

.toggle.en-lit, .en-auto { position: relative; justify-content: center; border: 1px solid var(--line); border-radius: 8px; background: var(--sunk); color: var(--muted); opacity: .6; transition: opacity .15s, background .15s, border-color .15s; }

    <span class="label-sm">套用到提升比較</span>
    <div class="import"><div class="box"><select id="import-target" aria-label="要套用的角色">${S.compare.chars.map((ch, i) => `<option value="${i}">${esc(ch.name)}</option>`).join('')}</select></div>
    <button class="btn primary" data-act="import">套用</button></div>
    <p class="hint">會覆蓋該角色原本的類型和數值。</p>`;
  return `${head}${tr}${zones}${imp}`;
}

// 算式條：計算核心回傳的每個乘區縮成一格短名稱，滑過看算法
const ZONE_SHORT = {
  '傷害提高（增傷區）': ['增傷', '1 + 傷害提高（持續傷害再加持續傷害提高）'],
  '防禦區': ['防禦', COMMON_FORMULA.find(x => x[0] === '防禦區')[1]],
  '抗性區': ['抗性', '1 − 屬性抗性 + 抗性穿透'],
  '受到的傷害提高（易傷區）': ['易傷', '1 + 受到的傷害提高'],
  '受到的傷害降低（減傷區）': ['減傷', '(1 − 受到的傷害降低) × (1 − 敵人特殊減傷)；歡愉傷害用特殊減傷（歡愉）'],
  '韌性區': ['韌性', '未擊破 0.9；弱點擊破狀態 1.0（擊破傷害固定 0.9、超擊破固定 1.0）'],
  '角色額外乘區': ['額外', '造成的傷害為原傷害的 X%，例如黃泉「奈落」'],
  '擊破特攻': ['擊破特攻', '1 + 擊破特攻'],
  '擊破傷害提高': ['擊破增傷', '1 + 擊破傷害提高'],
  '超擊破／擊破傷害提高': ['擊破增傷', '1 + 超擊破傷害提高 + 擊破傷害提高'],
  '歡愉度': ['歡愉度', '1 + 歡愉度'],
  '增笑': ['增笑', '1 + 增笑'],
  '笑點係數': ['笑點', '1 + 5 × 笑點 ÷ (笑點 + 240)'],
  '記錄比例': ['記錄', '記錄非真實傷害的 X%'],
  '換算比例': ['換算', '記錄值的 X% 轉成真實傷害'],
};
const BASE_SHORT = {
  direct: ['倍率屬性 × 倍率', '倍率屬性 × 技能倍率'], dot: ['倍率屬性 × 倍率', '倍率屬性 × 技能倍率'],
  break: ['基礎', '等級係數 × 屬性係數 × (0.5 + 韌性 ÷ 40)。屬性係數：物理、火 2；風 1.5；冰、雷 1；量子、虛數 0.5'],
  superBreak: ['基礎', '等級係數 × (削韌值 ÷ 10) × 轉換倍率'],
  breakDot: ['基礎', '灼燒 1×、觸電 2×、風化 1×層數、凍結 1×（以等級係數計）；裂傷 = 敵方生命 16%（精英／首領 7%），上限 2 × 等級係數 × 韌性係數；糾纏 0.6 × 等級係數 × 層數 × 韌性係數'],
  elation: ['基礎', '等級係數 × 2 × 歡愉倍率（等級係數 80 級 = 3767.55）'],
  trueRecord: ['記錄值', 'Σ 非真實傷害 × 記錄比例'],
};
function formulaHTML() {
  const c = S.calc;
  const p = { ...toCalc(c.env), ...toCalc(c.st), ...toCalc(c.p), defIgnore: 0, levelCoef: H.L80 };
  const r = H.compute(c.type, p);
  // 只列乘區名稱，數值放在右下的「各乘區」
  const term = (name, tip, cls = '') => `<span class="term ${cls}" tabindex="0" data-tip="${esc(tip)}">${esc(name)}</span>`;
  const [bn, bt] = BASE_SHORT[c.type];
  const parts = [term(c.type === 'direct' || c.type === 'dot' ? `${statLabels(c.p).stat} × 倍率` : bn, bt)];
  if (r.canCrit) parts.push(term('暴擊', COMMON_FORMULA[0][1]));
  for (const [n] of r.zones) { const [s, tip] = ZONE_SHORT[n] || [n, '']; parts.push(term(s, tip)); }
  return parts.join('<span class="op">×</span>') + '<span class="op">=</span>' + term(TYPES[c.type].label, '', 'total');
}

// ── 提升比較頁 ──
const scopeOptions = () => [['all', '全隊'], ...S.compare.chars.map((ch, i) => [`c:${i}`, ch.name])];

// 這個角色被方案改動、且適用的乘區，需要哪些目前數值
const NEED_ORDER = ['scaleStat', 'stat', 'baseStat', 'mult', 'crit', 'dmgBoost', 'extraMult', 'be', 'breakBoost', 'elationMult', 'elation', 'merry', 'punchline', 'atkLv', 'defIgnore', 'resPen'];
function needsFor(i) {
  const ch = S.compare.chars[i]; const char = new Set(), enemy = new Set();
  if (ch.type === 'trueLink') return { char, enemy };
  for (const sc of S.compare.schemes) for (const c of sc.changes) {
    const z = ZONES[c.zone];
    if (!inScope(c.scope, i) || !z || !z.types.includes(ch.type)) continue;
    const n = ZONE_NEEDS[c.zone] || {};
    (n.char || []).forEach(k => char.add(k)); (n.enemy || []).forEach(k => enemy.add(k));
  }
  return { char, enemy };
}

function charCard(ch, i, cm) {
  const base = `compare.chars.${i}`; const idp = `c${i}-`;

    ${body}
  </div>`;
}

function renderCompare() {

      <div class="box"><select id="s${s}c${k}-zone" data-bind="compare.schemes.${s}.changes.${k}.zone" aria-label="乘區">${Object.entries(ZONES).map(([z, m]) => `<option value="${z}" ${z === ch.zone ? 'selected' : ''}>${m.label}</option>`).join('')}</select></div>

      <p class="hint">先選要改動的乘區和增加量，下方只會出現算這些乘區需要的目前數值。屬性有轉化時直接填轉化後的乘區，例如火花攻擊力轉歡愉度，就填「歡愉度 +X%」。</p>

  </section>`;
}

const inScope = (scope, i) => scope === 'all' || scope === `c:${i}`;

function evalScheme(sc) {
  const cm = S.compare; const env = toCalc(pick(cm.env, ENEMY_KEYS));
  const gains = []; const why = [];
  // 一般角色
  cm.chars.forEach((ch, i) => {
    if (ch.type === 'trueLink') return;
    // 只看被改動的乘區：持續傷害提高、超擊破傷害提高已併入「總和」欄位
    const p = { ...env, ...toCalc(ch.st), ...toCalc(ch.p), dotBoost: 0, superBoost: 0, levelCoef: H.L80 };
    const before = H.expectedTotal(ch.type, p);
    const after = { ...p }; let extra = 1; const skipped = [];
    let touched = false;
    for (const c of sc.changes) {
      if (!inScope(c.scope, i)) continue;
      const z = ZONES[c.zone]; if (!z) continue;
      if (!z.types.includes(ch.type)) { skipped.push(z.label); continue; }
      touched = true;
      const d = z.unit === 'pct' ? num(c.delta) / 100 : num(c.delta);
      if (c.zone === 'statPct') after.stat += after.baseStat * d;
      else if (c.zone === 'statFlat') after.stat += d;
      else if (c.zone === 'custom') extra *= 1 + d;
      else after[c.zone] = (after[c.zone] || 0) + d;
    }
    gains[i] = before > 0 ? (H.expectedTotal(ch.type, after) * extra) / before : 1;
    // 只有在方案指名這個角色時才提示，全隊增益本來就會有人不適用
    if (!touched && skipped.length && sc.changes.some(c => c.scope === `c:${i}`)) why[i] = `${TYPE_LABEL(ch.type)}不適用${skipped.join('、')}；若有屬性轉化，請改填轉化後的乘區`;
  });
  // 真傷連動角色：跟著來源走
  cm.chars.forEach((ch, i) => {
    if (ch.type !== 'trueLink') return;
    let w = 0, s = 0;
    for (const k of ch.sources) {
      if (gains[k] === undefined) continue;
      const wt = num(cm.chars[k].share) || 1e-9;
      w += wt; s += wt * gains[k];
    }
    gains[i] = w > 0 ? s / w : 1;
    why[i] = w > 0 ? '' : '沒有選記錄來源';
  });
  // 彙總
  let team = 0; let totalShare = 0;
  const perChar = cm.chars.map((ch, i) => {
    const s = num(ch.share) / 100; totalShare += s; team += s * gains[i];
    return { f: gains[i], s };
  });
  team += Math.max(0, 1 - totalShare);
  return { team: team - 1, perChar, why, teamFactor: team };
}

function cmpResultHTML() {
  const cm = S.compare;
  const res = cm.schemes.map(sc => ({ sc, r: evalScheme(sc) })).sort((a, b) => b.r.team - a.r.team);
  const max = Math.max(1e-9, ...res.map(x => x.r.team));
  return `<div class="panel-h"><h2>隊伍總傷提升</h2><span class="sub">由高到低</span></div>
  <div class="rank">${res.map(({ sc, r }, n) => `<div class="rk">
    <div class="rk-top"><span class="n">${n + 1}</span><span class="name">${esc(sc.name)}</span><span class="pct ${r.team < 1e-9 ? 'zero' : ''}">${fmtPct(r.team)}</span></div>
    <div class="bar"><i style="width:${Math.max(0, (r.team / max) * 100).toFixed(1)}%"></i></div>
    <details class="bd"><summary>各角色明細</summary>
      <table><tr><th>角色</th><th>提升</th><th>改動後占比</th></tr>
      ${cm.chars.map((ch, i) => {
        const pc = r.perChar[i];
        return `<tr><td>${esc(ch.name)}</td><td>${fmtPct(pc.f - 1)}</td><td>${(pc.s * pc.f / r.teamFactor * 100).toFixed(1)}%</td></tr>`
          + (r.why[i] ? `<tr><td colspan="3" class="why">${esc(r.why[i])}</td></tr>` : '');
      }).join('')}</table>
    </details>
  </div>`).join('') || '<p class="hint">還沒有方案，按「新增方案」開始比較。</p>'}</div>
  <div class="hr"></div>
  <p class="hint">隊伍提升 = Σ 改動前總傷占比 × (改動後 ÷ 改動前) − 1；暴擊以期望值計算。目前數值需填寫正確，邊際提升才會準確。</p>`;
}

// ── 排軸頁 ──
const inTeam = id => S.speed.chars.some(c => c.id === id);
const hasAeonAha = () => inTeam('aha');
// 上方勾選是快速加入 E1 藿藿、E2 風堇的捷徑；角色選單也能選他們
const SUPPORTS = { huohuo: 'huohuoE1', hyacine: 'hyacineE2', yaoguang: 'yaoguangE2' };
const SUPPORT_SPD = { huohuo: 130, hyacine: 130, yaoguang: 160 };
// 勾選＝讓該角色以達到門檻的星魂在隊伍中（已在隊伍就只把星魂調到門檻）；取消勾選就移出
function syncSupport(id, on) {
  const sp = S.speed; const c = sp.chars.find(x => x.id === id);
  if (on) {
    if (c) c.eid = SPD_EID[id].need;
    else if (sp.chars.length < 4) sp.chars.push(newSpd(id, SUPPORT_SPD[id]));
  } else { sp.chars = sp.chars.filter(x => x.id !== id); sp.ahaUlt = []; sp.pearlFirst = null; }
}
// 全隊速度提高、每人戰鬥中速度、行動提前、阿哈時刻速度
function speedModel() {
  const sp = S.speed;
  const has = id => sp.chars.some(c => eidOn(c, id));
  const buff = (has('huohuo') ? 0.12 : 0) + (has('hyacine') ? 0.3 : 0) + (has('yaoguang') ? 0.12 : 0);
  const lc = hasAeonAha() ? AHA_LC[sp.ahaLc] || 0 : 0;
  const units = sp.chars.map((c, k) => {
    const m = SPD_CHARS[c.id] || SPD_CHARS.aha;
    const base = c.id === 'other' ? num(c.base ?? 100) : m.base + (c.id === 'aha' ? lc : 0);
    // 開局行動提前只開放給歡愉角色
    // 開局行動提前：歡愉角色與自定義角色
    // 開局行動提前：所有角色都有；神的瞬息歡愉只有歡愉角色（與自定義角色）能觸發
    const planar = c.planar === 'elation' && !(m.elation || c.id === 'other') ? 'none' : c.planar;
    const adv = (PLANAR[planar]?.[1] || 0) + (c.id === 'aha' ? 0.3 : 0) + num(c.adv) / 100;
    // 排軸上用簡稱（開拓者（歡愉）→ 開拓者）
    const name = c.id === 'other' ? String(c.name || '自定義角色') : m.short || m.name;
    // 遺器：開終結技後自己行動提前（翔鷹 25% 或自填 %）；星神★阿哈、真珠跟著自己的終結技時機
    // 遺器只有翔鷹和「無」（存成 other，沒有效果）兩種
    const relic = EAGLE_OFF.includes(c.id) ? 'none' : c.relic === 'eagle' ? 'eagle' : 'other';
    const pct = relic === 'eagle' ? 0.25 : 0;
    // 自定義角色另有：舞！舞！舞！（開終結技後我方全體行動提前 16–24%）、單體拉條（指定 1 名隊友行動提前）
    const selfPct = relic === 'none' ? 0 : pct;
    const allPct = c.id === 'other' ? DDD_PCT[+c.ddd || 0] || 0 : 0;
    // 單體拉條的對象沒選或已不在隊伍時，預設第一位隊友
    const pt = c.pullTarget !== undefined && c.pullTarget !== '' && sp.chars[+c.pullTarget] && +c.pullTarget !== k ? +c.pullTarget : sp.chars.findIndex((_, j) => j !== k);
    // 拉條戰技（布洛妮婭／花火／星期日）：自己每次行動都拉 1 名隊友
    const ps = PULL_SKILLS[c.pullSkill];
    const skill = c.id === 'other' && ps && pt >= 0 ? { idx: pt, pct: ps[1], every: 1, name: ps[0] } : null;
    const eagle = !(selfPct > 0) && !allPct ? null
      : EAGLE_AUTO.includes(c.id) ? { auto: true, pct: selfPct }
      : { pct: selfPct, allPct, every: Math.max(1, Math.round(num(c.every)) || 1), first: Math.max(1, Math.round(num(c.first)) || 1) };
    return { name, icon: m.icon, base, elation: !!m.elation, panel: num(c.spd), speed: H.battleSpeed(num(c.spd), base, buff), adv: Math.min(1, adv), afterAha: eidOn(c, 'sparxie'), aeon: c.id === 'aha', eagle, skill };
  });
  // 真珠終結技：美學底本只能選其他歡愉角色；依隊伍歡愉角色數 1／2／3 人行動提前 10%／15%／30%，4 人以上改給額外回合
  const elCount = units.filter(u => u.elation).length;
  const pIdx = sp.chars.findIndex(c => c.id === 'pearl');
  let pearl = null;
  if (pIdx >= 0) {
    const pc = sp.chars[pIdx];
    const ok = c => c.id !== 'pearl' && SPD_CHARS[c.id]?.elation;
    let tIdx = sp.chars.findIndex(c => c.id === pc.target && ok(c));
    if (tIdx < 0) tIdx = sp.chars.findIndex(ok);
    pearl = { idx: pIdx, target: tIdx, pct: elCount >= 3 ? 0.3 : elCount === 2 ? 0.15 : 0.1, extra: elCount >= 4, e2: eidOn(pc, 'pearl'), first: sp.pearlFirst || `${pIdx}:1` };
  }
  let aha = null;
  // 阿哈時刻模式：隊伍至少要有 1 名歡愉角色
  // 隊伍有歡愉角色就自動有阿哈時刻
  if (units.some(u => u.elation)) {
    const base = hasAeonAha() ? SPD_CHARS.aha.base + lc : 80;
    aha = { base, ...H.ahaSpeed(base, units.filter(u => u.elation).map(u => u.speed)) };
  }
  const all = aha ? [...units, { name: '阿哈時刻', speed: aha.speed, adv: 0, aha: true }] : units;
  const elation = units.filter(u => u.elation).sort((a, b) => b.speed - a.speed);
  // 星神★阿哈終結技：在勾選的那次行動時，阿哈時刻行動提前 20%
  const canUlt = !!aha && hasAeonAha();
  const pulls = canUlt ? (sp.ahaUlt || []).map(key => ({ key, pct: 0.2 })) : [];
  // 星神★阿哈 6 星魂：首次施放終結技後，阿哈時刻再行動提前 100%
  const firstPullBonus = canUlt && sp.chars.some(c => eidOn(c, 'aha')) ? 1 : 0;
  return { buff, units, aha, all, elation, canUlt, pulls, firstPullBonus, pearl, elCount };
}

const fieldWrap = (id, label, tip, ctl) => `<div class="f"><div class="f-label"><label for="${id}">${esc(label)}</label>${tipHTML(tip)}</div>${ctl}</div>`;
const checkHTML = (id, path, on, label, tip = '', attrs = '') => `<label class="toggle" for="${id}"><input type="checkbox" id="${id}" data-bind="${path}" ${attrs} ${on ? 'checked' : ''}>${esc(label)}${tipHTML(tip)}</label>`;
const SUPER = [[0, '無'], [1, '疊影 1'], [2, '疊影 2'], [3, '疊影 3'], [4, '疊影 4'], [5, '疊影 5']];

function spdCard(c, i) {
  const sp = S.speed; const idp = `sp${i}-`; const base = `speed.chars.${i}`;
  const m = SPD_CHARS[c.id] || SPD_CHARS.aha;

  const used = new Set(sp.chars.filter((_, k) => k !== i).map(x => x.id));

  const opts = Object.entries(SPD_CHARS)
    .filter(([k]) => k === c.id || (k === 'other' ? others < 4 : !used.has(k)))
    .map(([k, v]) => [k, v.name]);

  const isOther = c.id === 'other';
  const eidOpts = [0, 1, 2, 3, 4, 5, 6].map(n => [n, n === eid.need ? `星魂${n} ★` : `星魂${n}`]);

  const hasLeft = true;
  const hasAdv = hasLeft || hasRight;

  // 其他開局行動提前：右欄沒有終結技設定時（例如銀狼LV.999）移到右欄，左右不會一邊空著
  const advOther = `<div class="adv-inline">
              <span class="f-label"><label for="${idp}adv">${hasRight ? '其他開局行動提前' : '開局行動提前'}</label>${tipHTML('其他開局行動提前效果，與位面飾品相加')}</span>
              <div class="box n"><input type="number" step="any" inputmode="decimal" id="${idp}adv" data-bind="${base}.adv" value="${esc(c.adv)}"><span class="u">%</span></div>
            </div>`;
  const advStart = `<span class="label-sm">開局行動提前</span>

              <div class="pick" role="radiogroup" aria-label="位面飾品">${Object.entries(PLANAR).filter(([k]) => k !== 'elation' || m.elation || isOther).map(([k, [l, , ic]]) => pickHTML('radio', idp + 'planar', base + '.planar', (c.planar || 'none') === k, [k, ic], l)).join('')}</div>
              <p class="hint warn-sm" id="${idp}vwarn" ${vonwacqLow(c) ? '' : 'hidden'}>面板速度未達 120，生命的翁瓦克實際不會觸發</p></div>
            ${hasRight ? advOther : ''}`;
  // 一個角色一列：頭像｜角色｜面板速度 → 戰鬥中｜星魂（自定義角色改放名稱）｜進階設定｜移除

  return `<div class="spd-item">
    <div class="spd-row">
      <div class="c-av">${avatarHTML({ icon: m.icon, name: isOther ? c.name : m.name }, 'lg')}</div>
      <div class="c-char">${selHTML(idp + 'id', base + '.id', c.id, opts, 'data-struct aria-label="角色"')}</div>
      <div class="c-spd">${spd}</div>
      ${isOther
        ? `<div class="c-nm"><div class="box"><input type="text" class="txt" id="${idp}name" data-bind="${base}.name" value="${esc(c.name || '')}" aria-label="名稱" placeholder="名稱"></div></div>`
        : `<div class="c-eid">${selHTML(idp + 'eid', base + '.eid', eidVal, eidOpts, 'data-struct aria-label="星魂"')}</div>`}

function tlHTML(title, m, maxAV, mode) {
  const acts = H.timeline(m.all, maxAV, { pulls: m.pulls, firstPullBonus: m.firstPullBonus, pearl: m.pearl, opening: !!(m.aha && hasAeonAha()) });
  // 0 行動值也算第 1 動：隊伍有星神★阿哈時（秘技：進入戰鬥立即獲得額外回合）0 行動值就是阿哈時刻，
  // 阿哈時刻結束時的額外回合（火花 2 星魂）也接在後面；沒有阿哈時，真珠模式或真珠開場開大才顯示「戰鬥開始」
  const head = [];
  if (m.aha && hasAeonAha()) {
    head.push({ name: '阿哈時刻', aha: true, opening: true, av: 0, key: 'start' });
    // 開場阿哈時刻結束時的額外回合（火花 2 星魂）由排軸引擎產生，會回能量
  } else if (m.pearl && (mode === 'pearl' || m.pearl.first === 'start')) head.push({ name: '戰鬥開始', start: true, av: 0, key: 'start' });
  // 阿哈模式：一般角色的每次行動有圓鈕（可多選）；真珠模式：所有行動（含 0 行動值）有圓鈕（只能選一個）
  const isStart = a => a.opening || a.start;
  const dot = a => {
    // 阿哈時刻那一列也能按：在阿哈時刻結束時開終結技，拉下一個阿哈時刻
    if (mode === 'aha' && (!a.extra || a.key) && !a.start) {
      const on = a.opening ? (S.speed.ahaUlt || []).includes('start') : a.pull;
      return `<input type="checkbox" class="ult-dot" data-ult="${a.key}" ${on ? 'checked' : ''} title="${a.aha ? '在這次阿哈時刻結束時' : '在這次行動時'}施放星神★阿哈終結技" aria-label="${a.aha ? `在第 ${a.opening ? 1 : a.n + 1} 次阿哈時刻結束時` : a.extra ? `在${esc(a.name)}的額外回合時` : `在${esc(a.name)}第 ${a.n} 次行動時`}施放星神★阿哈終結技">`;
    }
    if (mode === 'pearl' && (isStart(a) || (!a.aha && !a.extra))) {
      const key = isStart(a) ? 'start' : a.key;
      return `<input type="radio" class="ult-dot pearl" name="pearl-first-${maxAV}" data-pdot="${key}" ${m.pearl.first === key ? 'checked' : ''} title="真珠第 1 次開終結技的時機" aria-label="${isStart(a) ? '戰鬥開始時' : `在${esc(a.name)}第 ${a.n} 次行動時`}施放真珠第 1 次終結技">`;
    }
    return '';
  };
  const pearlMark = avatarHTML({ icon: SPD_CHARS.pearl.icon }, 'xs');
  const marks = a => ((a.pull || (a.opening && (S.speed.ahaUlt || []).includes('start'))) && mode !== 'aha' ? avatarHTML({ icon: SPD_CHARS.aha.icon }, 'xs') : '')
    + (mode !== 'pearl' && (a.pearlFirst || (isStart(a) && m.pearl?.first === 'start')) ? pearlMark : '');
  // 「（已提前）」只標在阿哈時刻上；星神★阿哈 6 星魂時，第一次被拉的阿哈時刻標「（已提前 100%）」
  const firstPulled = m.firstPullBonus ? acts.find(a => a.aha && a.pulled) : null;
  const row = (a, n) => `<li class="${a.aha ? 'aha' : ''}${a.extra ? `ex${a.exKind === 'aha' ? ' ex-r' : ''}` : ''}${a.start ? ' start' : ''}"><span class="no">${n + 1}</span>${a.start ? '' : avatarHTML(a)}<span class="nm"><span class="nm-t" ${a.extra ? 'title="額外回合"' : ''}>${esc(a.name)}${a.aha && a.pulled ? (a === firstPulled ? '（已提前 100%）' : '（已提前）') : ''}</span>${a.extra ? '<span class="ex-t">（額外）</span>' : ''}${a.ult ? '<span class="tag" title="施放終結技">Q</span>' : ''}${a.skill ? '<span class="tag" title="施放拉條戰技">E</span>' : ''}${marks(a)}</span>${dot(a)}<span class="av">${fmt1(a.av)}</span></li>`;
  return `<div class="tl"><div class="tl-h">${title}<span>${maxAV}AV</span></div>
    <ol>${[...head, ...acts].map(row).join('') || '<li class="hint">沒有行動</li>'}</ol></div>`;
}

// 阿哈時刻算式：基礎 + V1×0.2 + V2×0.1 + V3×0.05 + V4×0.025，沒有的名次以 — 表示
function ahaCalcHTML(m) {
  const lc = m.aha.base - SPD_CHARS.aha.base;
  const baseNote = hasAeonAha() ? `星神★阿哈 ${SPD_CHARS.aha.base}${lc ? ` + 光錐 ${lc}` : ''}` : '隊伍沒有星神★阿哈';
  const rows = [[`基礎（${baseNote}）`, fmt1(m.aha.base)]];
  H.AHA_COEF.forEach((c, k) => {
    const u = m.elation[k];
    rows.push([`V${k + 1} 戰鬥中速度第${'一二三四'[k]}快${u ? `（${u.name} ${fmt1(u.speed)}）` : ''} × ${c}`, u ? '+ ' + fmt1(u.speed * c) : '—']);
  });
  rows.push(['阿哈時刻速度', fmt1(m.aha.speed)]);
  // 大字顯示阿哈時刻速度，點擊展開計算過程與公式
  return `<details class="aha-fx" id="aha-fx" ${S.speed.fxOpen ? 'open' : ''}>
    <summary><span class="kv"><span class="k">阿哈時刻速度</span><span class="v">${fmt1(m.aha.speed)}</span></span><span class="more-tip">${S.speed.fxOpen ? '收合' : '計算過程'}</span></summary>
    <div class="more-body">
      <p class="spd-calc">阿哈時刻速度 = 基礎 + V1×0.2 + V2×0.1 + V3×0.05 + V4×0.025</p>
      <div class="zones">${rows.map(([a, b]) => `<div><span>${esc(a)}</span><span>${b}</span></div>`).join('')}</div>
      <p class="hint">V1～V4：歡愉角色（含星神★阿哈）依戰鬥中速度由快到慢。行動值 = 10000 ÷ 速度 × (1 − 行動提前)</p>
    </div>
  </details>`;
}

function spdResultHTML() {
  const m = speedModel();
  // 角色列上的戰鬥中速度；進階設定的摘要
  m.units.forEach((u, i) => {
    const bs = document.getElementById(`sp${i}-bs`);
    if (bs) bs.textContent = '→ ' + fmt1(u.speed);
    // 改了數值就重新判斷預設隊伍有沒有打勾
    if (i === 0) SPD_PRESETS.forEach((p, k) => { const pc = document.getElementById(`sp-preset${k}`); if (pc) pc.checked = presetOn(p); });
    // 說明欄的亮暗跟著目前設定更新（例如換位面飾品不會整頁重畫）
    if (i === 0) { const fx = document.getElementById('spd-fx'); if (fx) fx.innerHTML = fxListHTML(); }
    const vw = document.getElementById(`sp${i}-vwarn`); if (vw) vw.hidden = !vonwacqLow(S.speed.chars[i]);
    const sum = document.getElementById(`sp${i}-sum`);
    const mo = document.getElementById(`sp${i}-mo`);

    const c = S.speed.chars[i];
    // 摘要列出所有生效的行動提前：開局、開大後自己、開大後我方全體、單體拉條
    const p = v => +(v * 100).toFixed(1) + '%';
    const txt = [c.id === 'aha' ? `光錐 ${S.speed.ahaLc ? 'S' + S.speed.ahaLc : '無'}` : '', u.elation || u.adv > 0 ? `開局行動提前 ${p(u.adv)}` : '',
      eidOn(c, 'aha') ? '6 魂：首次終結技使阿哈時刻行動提前 100%（僅一次）' : '',
      u.eagle?.pct > 0 ? `開大後行動提前 ${p(u.eagle.pct)}` : '', u.eagle?.allPct > 0 ? `開大後我方全體行動提前 ${p(u.eagle.allPct)}` : '',
      u.skill ? `${u.skill.name}（${m.units[u.skill.idx]?.name ?? ''}）行動提前 ${p(u.skill.pct)}` : '',
      c.id === 'pearl' && m.pearl?.target >= 0 ? `美學底本 ${m.units[m.pearl.target].name}` : ''].filter(Boolean).join(' · ');
    if (sum) sum.textContent = txt;
    // 收合時滑過按鈕可看目前的進階設定
    if (mo) mo.title = '進階設定' + (txt ? `：${txt}` : '');
  });
  // 切換：不設定／星神★阿哈終結技（圓鈕可多選）／真珠終結技（圓鈕只能選一個）
  const modes = [['none', '不設定'], ...(m.canUlt ? [['aha', '星神★阿哈終結技']] : []), ...(m.pearl ? [['pearl', '真珠首次終結技']] : [])];
  const mode = modes.some(([k]) => k === S.speed.pickMode) ? S.speed.pickMode : 'none';
  const nUlt = m.canUlt ? (S.speed.ahaUlt || []).length : 0;
  const sw = modes.length > 1 ? `<div class="end spd-sw">
      <div class="seg sm" role="group" aria-label="在排軸上設定終結技">${modes.map(([k, l]) => `<button data-act="pick-mode" data-v="${k}" aria-pressed="${k === mode}">${l}</button>`).join('')}</div>
      ${nUlt ? `<button class="btn sm" data-act="ult-clear" title="清空已設定的星神★阿哈終結技（${nUlt} 次）">清空</button>` : ''}
      ${tipHTML('星神★阿哈：在排軸上插入阿哈終結技的施放時機（可多選）。真珠：選第 1 次終結技的時機（單選）。')}</div>` : '';
  return `<div class="panel-h"><h2>行動順序</h2>${sw}</div>
    ${m.aha ? ahaCalcHTML(m) : ''}
    <div class="tl-grid">${tlHTML('混沌回憶', m, 150, mode)}${tlHTML('異相仲裁', m, 300, mode)}</div>`;
}

// 左欄裡跟著結果變的小字（效率、回合行動、每列每動小計），不重畫整頁

  const isum = document.getElementById('en-int-sum'); if (isum) isum.textContent = num(en.hitEvery) > 0 ? `每 ${f2(num(en.hitEvery))} 動受擊 1 次・每次 ${f2(num(en.hit))} 能量` : '不算受擊';
  EN_TURN_ACTS.forEach(([k]) => {
    const b = document.getElementById(`en-use-${k}`); if (!b) return;
    const on = r.main === k;

// ── 速度閾值 ──
// 欄：[代號, 行動值, 標題, 副標, 算不算開局提前]；混沌回憶 0 輪 150、第 2 波 150（開局提前不生效）、異相仲裁 0／1／2 輪 300／400／500
const TH_TS = [['c0', 150, '混沌', '0 輪', true], ['c2', 150, '混沌', '2 波', false], ['a0', 300, '異相', '0 輪', true], ['a1', 400, '異相', '1 輪', true], ['a2', 500, '異相', '2 輪', true]];
// 第 1 次開大：0 行動值（第 1 動之前）、首動後、二動後
const TH_FIRST = [[0, '0 行動值開大'], [1, '首動開大'], [2, '二動開大']];
function defaultThreshold() { return { first: 2, every: 3, spd: 140, rows: 10, rowsV: 2, startAdv: 40, wind: true, ddd: false, ultOther: '', mates: [] }; }
// 舊存檔：「首動開大」開關＋第幾動後 → 三選一；隊友改成手動填拉條與各欄次數；拿掉多張表格
function thMigrate(o) {
  const d = defaultThreshold(); if (!o) return d;
  const r = { ...d, ...o };
  if (!('first' in o) && 'firstUlt' in o) r.first = o.firstUlt ? 1 : Math.min(2, Math.max(1, Math.round(+o.firstAt) || 2));
  delete r.firstUlt; delete r.firstAt; delete r.tables; delete r.nextId;
  // 預設列數 8 → 10：沒改過的舊存檔一起換成 10
  if (o.rowsV !== 2) { if (+o.rows === 8 || o.rows == null) r.rows = 10; r.rowsV = 2; }
  r.mates = Array.isArray(r.mates) ? r.mates.map(m => ({ name: m.name ?? '', pull: m.pull ?? 24, n: m.n && typeof m.n === 'object' ? m.n : {} })) : [];
  return r;
}
const thId = path => 'th-' + path.replace(/\./g, '-');
const thNum = (path, unit = '', attrs = '') => `<div class="box"><input type="number" step="any" min="0" inputmode="decimal" id="${thId(path)}" data-bind="${path}" value="${esc(getPath(path) ?? '')}" ${attrs}>${unit ? `<span class="u">${unit}</span>` : ''}</div>`;
const thField = (label, path, unit, tip = '') => `<div class="f"><div class="f-label"><label for="${thId(path)}">${esc(label)}</label>${tipHTML(tip)}</div>${thNum(path, unit)}</div>`;
const thFirst = (label, path, tip) => `<div class="f"><div class="f-label"><label for="${thId(path)}">${label}</label>${tipHTML(tip)}</div>${selHTML(thId(path), path, getPath(path), TH_FIRST)}</div>`;
const thInt = (v, lo, hi, d) => Math.min(hi, Math.max(lo, Math.round(num(v)) || d));

function thResultHTML() {
  const th = S.threshold; const spd = num(th.spd);
  const every = thInt(th.every, 1, 99, 3), first = thInt(th.first, 0, 2, 2), rowsN = thInt(th.rows, 1, 20, 10);
  const ts = TH_TS.map(c => c[1]);
  const ultAdv = (th.wind ? 0.25 : 0) + (th.ddd ? 0.24 : 0) + num(th.ultOther) / 100;
  const pulls = TH_TS.map(([k]) => th.mates.reduce((s, mt) => s + num(mt.pull) / 100 * num(mt.n?.[k]), 0));
  const startAdv = TH_TS.map(c => (c[4] ? num(th.startAdv) / 100 : 0));
  const rows = H.speedThreshold({ first, every, rows: rowsN, ts, startAdv, ultAdv, pulls });
  // 每欄第一個還沒達到的格子＝下一個閾值
  const next = ts.map((_, j) => rows.findIndex(r => r.need[j] > spd + 1e-9));
  return `<div class="panel-h"><h2>速度閾值</h2><span class="sub">套用上面填的所有效果，在該行動值內行動 n 次需要的速度</span></div>
    <div class="en-card th-card">
      <table class="th-t">
        <thead><tr><th>動數</th>${TH_TS.map(([, T, a, b, s], j) => `<th${s ? '' : ' title="開局提前不算"'}>${a} ${b}<span>${T} AV${pulls[j] ? `・拉 ${f2(pulls[j] * 100)}%` : ''}</span></th>`).join('')}</tr></thead>
        <tbody>${rows.map((r, i) => `<tr><th>${r.n} 動${r.ult ? '<span class="th-q" title="這動之後施放終結技">Q</span>' : ''}</th>${r.need.map((v, j) => {
          const ok = spd > 0 && v <= spd + 1e-9; const nx = spd > 0 && next[j] === i;
          return `<td class="${ok ? 'ok' : ''}${nx ? ' nx' : ''}">${v.toFixed(1)}</td>`;
        }).join('')}</tr>`).join('')}</tbody>
      </table>
    </div>
    <p class="hint en-note" title="需要的速度 = (n − 開局提前 − 終結技提前 × 第 n 動之前的終結技次數 − Σ 其他拉條 × 次數) × 10000 ÷ 行動值。混沌第 2 波：開局提前不算。${first === 0 ? '0 行動值開大：開大提前作用在第 1 動。' : ''}">綠字＝目前速度已達到・橘字＝下一個閾值・Q＝這動之後開大${first === 0 ? '・0 行動值開大' : ''}</p>`;
}

const app = document.getElementById('app');
function updateResults() {
  const a = document.getElementById('calc-result'); if (a) a.innerHTML = calcResultHTML();

function render() {
  const focusId = document.activeElement?.id;
  document.querySelectorAll('.tabs button').forEach(b => { b.setAttribute('aria-selected', b.dataset.tab === S.tab); if (b.dataset.tab === S.tab) document.getElementById('menu-cur').textContent = b.textContent; });
  app.innerHTML = S.tab === 'calc' ? renderCalc() : S.tab === 'speed' ? renderSpeed() : S.tab === 'energy' ? renderEnergy() : S.tab === 'threshold' ? renderThreshold() : renderCompare();
  updateResults();

app.addEventListener('input', e => {
  const el = e.target; const path = el.dataset.bind; if (!path) return;
  if (el.type === 'checkbox') setPath(path, el.checked);
  else if (el.type === 'number') setPath(path, el.value === '' ? '' : +el.value);
  else setPath(path, el.value);
  // 記錄型真實傷害的角色設定改變時，重新算出記錄比例與換算比例
  if (/^calc\.p\.(trueChar|cipher\w+|robinMood)$/.test(path)) { syncTruePreset(S.calc.p); save(); render(); return; }
  // 勾選輔助星魂時，讓該輔助加入或移出隊伍
  // 換角色後隊伍序號對不上，清掉已勾的大招時機

  if (/^speed\.chars\.\d+\.id$/.test(path)) {
    S.speed.ahaUlt = []; S.speed.pearlFirst = null;
    // 換角色時星魂和名稱改回該角色的預設
    const c = getPath(path.replace(/\.id$/, '')); c.eid = SPD_EID[c.id]?.def ?? 0; if (c.id === 'other' && (!c.name || c.name === '自定義角色')) c.name = nextOtherName(c);
  }
  const supId = Object.keys(SUPPORTS).find(k => path === 'speed.' + SUPPORTS[k]);
  if (supId) { syncSupport(supId, el.checked); save(); render(); return; }
  save();
  if ((el.tagName === 'SELECT' && (el.hasAttribute('data-struct') || /\.(zone|scope|scaleStat)$/.test(path))) || ((el.type === 'checkbox' || el.type === 'radio') && el.hasAttribute('data-struct')) || path.endsWith('.broken')) render();
  else updateResults();
});
app.addEventListener('change', e => {
  const el = e.target;
  // 真珠第 1 次大招的時機：「誰」選戰鬥開始或某位角色，再填第幾動
  // 真珠模式的圓鈕：真珠第 1 次開終結技的時機（只能選一個）
  if (el.dataset.pdot) { S.speed.pearlFirst = el.dataset.pdot; save(); updateResults(); return; }
  if (el.dataset.pf) {
    const who = document.getElementById('sp-pf-who')?.value ?? 'start';
    const n = Math.max(1, Math.round(num(document.getElementById('sp-pf-n')?.value)) || 1);
    S.speed.pearlFirst = who === 'start' ? 'start' : `${who}:${n}`;
    save(); updateResults(); return;
  }
  // 排軸上勾選「大招」：記錄在哪一次行動時施放星神★阿哈終結技

  if (el.dataset.ult) {
    const k = el.dataset.ult; const list = S.speed.ahaUlt || [];
    S.speed.ahaUlt = el.checked ? [...new Set([...list, k])] : list.filter(x => x !== k);
    save(); updateResults(); return;
  }
  if (el.dataset.act === 'src') {
    const ch = S.compare.chars[+el.dataset.i]; const v = +el.dataset.v;
    ch.sources = el.checked ? [...new Set([...ch.sources, v])] : ch.sources.filter(x => x !== v);
    save(); updateResults(); return;
  }
  if (el.dataset.act === 'fx') { S.calc.fxOpen = el.checked; save(); render(); return; }
  // 血腦屏障開關：開啟時帶入參考值，關閉時歸零
  if (el.dataset.act === 'barrier') {
    const env = S.calc.env; env.barrier = el.checked;
    env.special = el.checked ? 75 : 0; env.specialElation = el.checked ? -300 : 0;
    save(); render(); return;
  }
  // 輸入完（離開欄位）才重畫，例如遺器「其他」% 從 0 改成有數值時顯示開大設定
  if ((el.type === 'text' || el.type === 'number') && el.hasAttribute('data-struct')) render();
});

app.addEventListener('toggle', e => {

  if (d.id === 'aha-fx') { S.speed.fxOpen = d.open; const tip = d.querySelector('.more-tip'); if (tip) tip.textContent = d.open ? '收合' : '計算過程'; save(); return; }
  if (!d.classList?.contains('more')) return;
  const c = S.speed.chars[+d.dataset.i]; if (c) { c.open = d.open; save(); }
}, true);

// 移除角色後，修正指向它的記錄來源與方案範圍
function removeChar(i) {
  const cm = S.compare;
  cm.chars.splice(i, 1);
  const fix = n => (n === i ? null : n > i ? n - 1 : n);
  cm.chars.forEach(ch => { ch.sources = ch.sources.map(fix).filter(n => n !== null); });
  cm.schemes.forEach(sc => sc.changes.forEach(c => {
    if (c.scope === 'all') return;
    const n = fix(+c.scope.split(':')[1]);
    c.scope = n === null ? 'all' : `c:${n}`;
  }));
}

app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled || ['src', 'barrier', 'fx'].includes(b.dataset.act)) return;
  const cm = S.compare; const i = +b.dataset.i, s = +b.dataset.s, k = +b.dataset.k;
  switch (b.dataset.act) {
    case 'calc-type': S.calc.type = b.dataset.v; break;
    case 'import': {
      const ch = cm.chars[+document.getElementById('import-target').value];
      ch.type = S.calc.type; ch.p = { ...S.calc.p }; ch.st = { ...S.calc.st };
      S.tab = 'compare'; break;
    }
    case 'add-char': cm.chars.push(newChar(String.fromCharCode(65 + cm.chars.length), 0, 'direct')); break;
    case 'del-char': removeChar(i); break;
    case 'add-scheme': cm.schemes.push({ name: `方案 ${cm.schemes.length + 1}`, changes: [{ zone: 'cd', delta: 10, scope: 'all' }] }); break;
    case 'del-scheme': cm.schemes.splice(s, 1); break;
    case 'add-change': cm.schemes[s].changes.push({ zone: 'dmgBoost', delta: 10, scope: 'all' }); break;
    case 'del-change': cm.schemes[s].changes.splice(k, 1); break;
    case 'spd-add': {
      // 優先補上還沒派出的歡愉角色，都派過了就加「其他」
      const used = new Set(S.speed.chars.map(c => c.id));
      const id = Object.keys(SPD_CHARS).find(k => SPD_CHARS[k].elation && !used.has(k)) || 'other';
      if (id === 'other' && S.speed.chars.filter(c => c.id === 'other').length >= 4) return;
      S.speed.chars.push(newSpd(id, id === 'other' ? 120 : 140)); break;
    }
    case 'spd-del': S.speed.chars.splice(i, 1); S.speed.ahaUlt = []; S.speed.pearlFirst = null; break;
    case 'pick-mode': S.speed.pickMode = b.dataset.v; break;
    case 'ult-clear': S.speed.ahaUlt = []; break;
    case 'lc': S.speed.ahaLc = +b.dataset.v; break;
    // 套用預設隊伍；取消勾選不動目前隊伍
    case 'preset': {
      const p = SPD_PRESETS[k];
      if (!b.checked || !p) break;
      S.speed.chars = presetChars(p); S.speed.ahaLc = presetLc(p); S.speed.ahaUlt = []; S.speed.pearlFirst = null; break;
    }
    case 'ddd': S.speed.chars[i].ddd = +b.dataset.v; break;
    case 'spd-more': S.speed.chars[i].open = !S.speed.chars[i].open; break;
    case 'tl-pick': {
      // 點排軸的列：阿哈終結技可多選（再點取消）；真珠第一次終結技只能一個
      const key = b.dataset.key; const sp = S.speed;
      if (sp.pickMode === 'aha') sp.ahaUlt = sp.ahaUlt.includes(key) ? sp.ahaUlt.filter(x => x !== key) : [...sp.ahaUlt, key];

      save(); updateResults(); return;
    }
    // 回能計算：回合行動指定／自動、回合外自動、新增、移除
    case 'en-main': S.energy.main = b.dataset.v; break;
    case 'en-oauto': { const a = S.energy.acts[b.dataset.v]; a.auto = !a.auto; if (!a.auto && !num(a.n)) a.n = 1; break; }
    case 'en-add': S.energy.extras.push({ name: '', v: 0, bind: 'turnAct', fixed: b.dataset.v === '1' }); break;
    case 'en-del': S.energy.extras.splice(i, 1); break;
    // 速度閾值：新增、移除其他拉條效果
    case 'th-add-mate': S.threshold.mates.push({ name: '', pull: 24, n: {} }); break;
    case 'th-del-mate': S.threshold.mates.splice(i, 1); break;
    default: return;
  }
  save(); render();
});

document.querySelector('.tabs').addEventListener('click', e => {
  const t = e.target.closest('[data-tab]'); if (!t) return;
  setMenu(false);
  S.tab = t.dataset.tab; save(); render();
  try { history.replaceState(null, '', '#' + S.tab); } catch {}
});
// 手機的漢堡選單：點按鈕展開／收起，選完分頁或點頁首外面就收起
const topEl = document.querySelector('header.top'), menuBtn = document.getElementById('menu-btn');
const setMenu = open => { topEl.classList.toggle('open', open); menuBtn.setAttribute('aria-expanded', open); };
menuBtn.addEventListener('click', () => setMenu(!topEl.classList.contains('open')));
// 深色模式按鈕（頁首和手機選單各一顆）：顯示「按下去會切到的」那一種（深色時顯示太陽，淺色時顯示月亮）
const themeBtns = document.querySelectorAll('[data-theme-btn]'), sysDark = matchMedia('(prefers-color-scheme: dark)');
const isDark = () => (document.documentElement.dataset.theme || (sysDark.matches ? 'dark' : 'light')) === 'dark';
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg>';
const syncTheme = () => { const d = isDark(); themeBtns.forEach(b => { b.innerHTML = d ? SUN : MOON; b.title = d ? '切換成淺色模式' : '切換成深色模式'; b.setAttribute('aria-label', b.title); }); };
themeBtns.forEach(b => b.addEventListener('click', () => {
  const t = isDark() ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('nouslab-theme', t); } catch {}
  syncTheme();
}));
sysDark.addEventListener('change', syncTheme);
syncTheme();

// GitHub：上傳後把網址填在這裡；沒填時只顯示圖示、不能點
const GITHUB_URL = '';
const ghLink = document.getElementById('gh-link');
if (GITHUB_URL) ghLink.href = GITHUB_URL; else ghLink.title = 'GitHub（即將公開）';

// 繁簡切換：頁面原文是繁體；切到簡體時用 OpenCC 把畫面上的文字逐字轉成簡體，之後重新繪製的內容也會自動轉
// 用 tw→cn 逐字轉換，不做詞彙替換（詞彙替換會把「預設」變「缺省」、「介面」變「接口」）
// 轉換前的原文記在 origText／origAttr，切回繁體時直接還原，不用重新載入整頁
const LANG_KEY = 'nouslab-lang', LANG_ATTRS = ['title', 'placeholder', 'aria-label', 'data-tip', 'alt'];
const LANG_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 8 6 6M4 14l6-6 2-3M2 5h12M7 2h1M22 22l-5-10-5 10M14 18h6"/></svg>';
const langBtns = document.querySelectorAll('[data-lang-btn]');
let toHans = null, hansObs = null, origTitle = document.title;
const origText = new WeakMap(), origAttr = new WeakMap();
const syncLang = () => langBtns.forEach(b => { b.innerHTML = LANG_ICON; b.title = toHans ? '切换成繁体中文' : '切換成簡體中文'; b.setAttribute('aria-label', b.title); });
const hansText = n => { const o = n.nodeValue, v = toHans(o); if (v !== o) { origText.set(n, o); n.nodeValue = v; } };
const hansAttr = (el, a) => {
  const o = el.getAttribute(a); if (!o) return;
  const v = toHans(o); if (v === o) return;
  if (!origAttr.has(el)) origAttr.set(el, {});
  origAttr.get(el)[a] = o; el.setAttribute(a, v);
};
const eachText = (root, fn) => {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement?.closest('script,style') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  for (let n; (n = w.nextNode());) fn(n);
};
function hansTree(root) {
  if (root.nodeType === 3) return hansText(root);
  if (root.nodeType !== 1 || root.closest('script,style')) return;
  [root, ...root.querySelectorAll('*')].forEach(el => LANG_ATTRS.forEach(a => hansAttr(el, a)));
  eachText(root, hansText);
}
// 開頁時若已選簡體，頁首的 script 已經同步載入 OpenCC；平常切換時才動態載入
const loadOpenCC = () => window.OpenCC ? Promise.resolve() : new Promise((ok, fail) => {
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/t2cn.js';
  s.onload = ok; s.onerror = fail; document.head.append(s);
});
const showPage = () => document.documentElement.classList.remove('lang-wait');
async function enableHans() {
  await loadOpenCC();
  toHans = OpenCC.Converter({ from: 'tw', to: 'cn' });
  document.documentElement.lang = 'zh-Hans';
  origTitle = document.title; document.title = toHans(origTitle);
  syncLang();
  hansTree(document.body);
  hansObs = new MutationObserver(ms => ms.forEach(m => {
    if (m.type === 'characterData') hansText(m.target);
    else if (m.type === 'attributes') hansAttr(m.target, m.attributeName);
    else m.addedNodes.forEach(hansTree);
  }));
  hansObs.observe(document.body, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: LANG_ATTRS });
  showPage();
}
function disableHans() {
  hansObs?.disconnect(); hansObs = null; toHans = null;
  document.documentElement.lang = 'zh-Hant';
  document.title = origTitle;
  eachText(document.body, n => { if (origText.has(n)) { n.nodeValue = origText.get(n); origText.delete(n); } });
  document.body.querySelectorAll('*').forEach(el => { const o = origAttr.get(el); if (o) { Object.entries(o).forEach(([a, v]) => el.setAttribute(a, v)); origAttr.delete(el); } });
  syncLang(); syncTheme(); render();
}
langBtns.forEach(b => b.addEventListener('click', () => {
  if (toHans) { try { localStorage.setItem(LANG_KEY, 'hant'); } catch {} disableHans(); return; }
  try { localStorage.setItem(LANG_KEY, 'hans'); } catch {}
  enableHans().catch(() => { try { localStorage.removeItem(LANG_KEY); } catch {} b.title = '簡體轉換載入失敗，請稍後再試'; });
}));
syncLang();
try { if (localStorage.getItem(LANG_KEY) === 'hans') enableHans().catch(showPage); else showPage(); } catch { showPage(); }
document.addEventListener('click', e => { if (!topEl.contains(e.target)) setMenu(false); });
const h = location.hash.slice(1);
if (h === 'calc' || h === 'compare' || h === 'speed' || h === 'energy' || h === 'threshold') S.tab = h;
syncTruePreset(S.calc.p);
render();
})();
</script>
